[project]
name = "host-hardening-assurance-lab"
version = "1.0.0"
description = "Read-only host baseline assurance and drift evidence by Jason Stys"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Jason Stys"}]
dependencies = ["PyYAML==6.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["hardening"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["hardening"]
